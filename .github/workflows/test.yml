name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Install isolated SQL test runner
        run: npm install --prefix /tmp/chs-sql-qa --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify location, presence and PLUS permissions with PostgreSQL
        run: node scripts/social-map-sql-qa.mjs /tmp/chs-sql-qa/node_modules/@electric-sql/pglite/dist/index.js
